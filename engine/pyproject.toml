[project]
name = "novem-engine"
version = "0.1.0"
description = "NOVEM — E-Commerce Intelligence Platform Compute Engine"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
